<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Squircle background: indigo — same blue-family visual language as
       Unicommerce/Payment Core/Ecommerce Core, but a distinct hue so it
       doesn't collide with either of them. -->
  <rect x="0" y="0" width="160" height="160" rx="36" fill="#5B4FE5"/>

  <!-- "Layers" glyph (Feather-icons style): represents Medusa's headless,
       API-first architecture — distinct from the box/bag/screen glyphs
       already used by the sibling apps. -->
  <g transform="translate(40,40) scale(3.333)"
     fill="none" stroke="#FFFFFF" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  </g>
</svg>
